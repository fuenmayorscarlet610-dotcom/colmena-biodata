<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COLMENA BIODATA | © SCARLET FUENMAYOR</title>
    <!-- SDK Oficial de Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent-cyan: #00f2ff;
            --accent-crimson: #d90429;
            --accent-violet: #8a2be2;
            --bg-dark: #030305; 
            --panel-bg: rgba(8, 10, 16, 0.9);
            --border-glow: rgba(0, 242, 255, 0.25);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, html { 
            background-color: var(--bg-dark); 
            color: #e0e6ed; 
            font-family: 'Orbitron', sans-serif; 
            min-height: 100vh; 
            width: 100vw; 
            overflow-x: hidden;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(138, 43, 226, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 50% 90%, rgba(0, 242, 255, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
        }

        /* Loader */
        #loader { 
            position: fixed; inset: 0; background: #020204; z-index: 3000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .progress-container { 
            width: 240px; height: 3px; background: rgba(255, 255, 255, 0.05); 
            border-radius: 10px; margin-top: 25px; overflow: hidden; border: 1px solid rgba(0, 242, 255, 0.15); 
        }
        #progress-bar { 
            width: 0%; height: 100%; 
            background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan)); 
            box-shadow: 0 0 12px var(--accent-cyan); transition: width 0.1s linear; 
        }

        /* Terminal Principal */
        .aegis-terminal {
            width: 92vw; max-width: 480px; margin: 20px auto;
            background: var(--panel-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow); border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 242, 255, 0.03);
            display: none; flex-direction: column; align-items: center; padding: 28px 20px;
            position: relative; overflow: hidden;
        }

        .aegis-terminal::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-crimson), transparent);
        }

        /* Header & Foto */
        .profile-box { position: relative; width: 95px; height: 95px; margin-bottom: 12px; }
        .ring { 
            width: 100%; height: 100%; border: 1px solid var(--accent-cyan); border-radius: 50%; 
            padding: 4px; position: relative; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); 
        }
        .profile-img { 
            width: 100%; height: 100%; border-radius: 50%; 
            background: url('perfil.png') center/cover no-repeat; 
            border: 1px solid rgba(0, 242, 255, 0.4); 
        }
        .laser { 
            position: absolute; width: 100%; height: 2px; background: var(--accent-crimson); 
            box-shadow: 0 0 10px var(--accent-crimson); animation: scan 3s infinite ease-in-out; left: 0; z-index: 5; 
        }
        @keyframes scan { 0% { top: 10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 90%; opacity: 0; } }

        .dev-tag { color: var(--accent-crimson); font-size: 0.62rem; font-weight: 800; letter-spacing: 4px; margin-bottom: 4px; }
        h2 { font-family: 'Cinzel', serif; font-size: 1.3rem; letter-spacing: 2px; color: #ffffff; font-weight: 800; }
        .sync-text { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; margin: 4px 0 16px; color: var(--accent-cyan); opacity: 0.8; }

        /* Módulos Tácticos & Biométricos */
        .bio-stats {
            width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(0, 242, 255, 0.1);
            border-radius: 8px; padding: 8px 4px; text-align: center;
        }
        .stat-val { font-size: 0.75rem; color: var(--accent-cyan); font-family: 'Share Tech Mono'; font-weight: bold; }
        .stat-lbl { font-size: 0.5rem; color: #8a8d93; letter-spacing: 1px; margin-top: 2px; }

        /* Formulario Biodata */
        .input-group { width: 100%; }
        .t-field, .t-area { 
            width: 100%; background: rgba(3, 5, 10, 0.8); border: 1px solid rgba(0, 242, 255, 0.18); 
            border-radius: 10px; padding: 12px 14px; color: #fff; font-family: 'Share Tech Mono', monospace; 
            margin-bottom: 10px; outline: none; font-size: 0.8rem; transition: all 0.3s ease;
        }
        .t-field:focus, .t-area:focus { border-color: var(--accent-cyan); box-shadow: 0 0 12px rgba(0, 242, 255, 0.2); }
        .t-area { height: 65px; resize: none; }

        .btn-main { 
            width: 100%; padding: 14px; border-radius: 10px; border: none; 
            background: linear-gradient(135deg, #d90429, #8a2be2); color: white; 
            font-weight: 800; font-family: 'Orbitron'; cursor: pointer; font-size: 0.8rem; 
            box-shadow: 0 4px 18px rgba(217, 4, 41, 0.35); letter-spacing: 2px; margin-bottom: 10px; 
        }

        /* Botón de Descarga PDF Proyecto */
        .btn-pdf {
            width: 100%; padding: 12px; border-radius: 10px; 
            border: 1px solid var(--accent-cyan); background: rgba(0, 242, 255, 0.05); 
            color: var(--accent-cyan); font-family: 'Share Tech Mono'; font-size: 0.72rem; 
            font-weight: bold; cursor: pointer; letter-spacing: 1.5px; text-decoration: none; 
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        .btn-pdf:hover { background: rgba(0, 242, 255, 0.15); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }

        .grid-links { display: none; width: 100%; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .c-link { font-size: 0.58rem; padding: 10px 2px; border-radius: 8px; color: white; text-decoration: none; font-weight: bold; text-align: center; }

        /* Footer y Logo */
        .footer-logo { 
            width: 55px; height: 55px; border: 1px solid rgba(0, 242, 255, 0.3); border-radius: 50%; 
            margin: 14px 0 8px; padding: 4px; background: #020204;
            display: flex; align-items: center; justify-content: center;
        }
        .footer-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        .copy { font-family: 'Share Tech Mono', monospace; font-size: 0.52rem; opacity: 0.6; letter-spacing: 1px; text-align: center; color: var(--accent-cyan); }
    </style>
</head>
<body>

<div id="loader">
    <div id="load-status" style="letter-spacing: 4px; font-weight: 800; color: var(--accent-cyan); font-size: 0.65rem;">CELDA BIODATA: INICIALIZANDO...</div>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <button onclick="boot()" id="ignite-btn" style="margin-top:30px; background: linear-gradient(135deg, var(--accent-crimson), #8a2be2); border: none; color:white; padding:12px 32px; font-family:'Orbitron'; border-radius:20px; font-weight:800; cursor:pointer; opacity: 0; display:none; box-shadow: 0 0 20px rgba(217, 4, 41, 0.4); letter-spacing: 2px;">INGRESAR A LA CELDA</button>
</div>

<div class="aegis-terminal" id="terminal">
    <div class="profile-box">
        <div class="ring"><div class="laser"></div><div class="profile-img"></div></div>
    </div>
    <div class="dev-tag">NÚCLEO COLMENA BIODATA</div>
    <h2>SCARLET FUENMAYOR</h2>
    <div class="sync-text">[ ID NODO TELEGRAM: <span id="user-tg">BELLA BAXTER CORE</span> ]</div>

    <!-- Indicadores de Celda de Laboratorio -->
    <div class="bio-stats">
        <div class="stat-card">
            <div class="stat-val">99.8%</div>
            <div class="stat-lbl">SINCRO NODO</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" style="color:var(--accent-crimson)">ACTIVO</div>
            <div class="stat-lbl">DIAGNOSTICO</div>
        </div>
        <div class="stat-card">
            <div class="stat-val">ALFA-1</div>
            <div class="stat-lbl">CELDA LAB</div>
        </div>
    </div>

    <!-- Botón de Descarga del PDF explicativo -->
    <a href="Prototipo_Colmena_Biodata.pdf" download class="btn-pdf">
        📄 DESCARGAR MANIFIESTO PDF
    </a>

    <div class="input-group">
        <input type="text" id="c-name" class="t-field" placeholder="ALIAS / ENTIDAD BIODATA">
        <textarea id="c-req" class="t-area" placeholder="SINTETIZA TU EXISTENCIA / DIAGNÓSTICO / AYUDA"></textarea>
        <button class="btn-main" onclick="execute()">REGISTRAR EN LA COLMENA</button>
        
        <div class="grid-links" id="links">
            <a id="wa-btn" href="#" target="_blank" class="c-link" style="background: #0f6e5e;">WHATSAPP</a>
            <a id="tg-btn" href="#" target="_blank" class="c-link" style="background: #0077b5;">TELEGRAM</a>
            <a id="em-btn" href="#" class="c-link" style="background: #8b0000;">EMAIL</a>
        </div>
    </div>

    <div id="phrase" style="font-family:'Share Tech Mono'; font-size:0.68rem; margin:10px 0; color:var(--accent-cyan); text-align:center;"></div>

    <!-- Logo con Respaldo Automático si falla la imagen -->
    <div class="footer-logo">
        <img src="AEGIS.png" alt="AEGIS" onerror="this.onerror=null; this.src='aegis.png';">
    </div>
    <div class="copy">
        © 2026 SCARLET FUENMAYOR | AFORO & APORTE MASIVO RECÍPROCO
    </div>
</div>

<audio id="bgm" loop preload="auto"><source src="musica.mp3" type="audio/mpeg"></audio>

<script>
    const tgApp = window.Telegram?.WebApp;
    if (tgApp) { tgApp.ready(); tgApp.expand(); }

    const bgm = document.getElementById('bgm');
    const bar = document.getElementById('progress-bar');
    const ignite = document.getElementById('ignite-btn');

    let width = 0;
    let interval = setInterval(() => {
        if (width >= 100) {
            clearInterval(interval);
            document.getElementById('load-status').innerText = "CELDA CONECTADA";
            ignite.style.display = 'block';
            setTimeout(() => ignite.style.opacity = '1', 50);
        } else {
            width += 2; bar.style.width = width + '%';
        }
    }, 20); 

    function boot() {
        bgm.play().catch(e => console.log("Audio interact required"));
        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('terminal').style.display = 'flex';
            
            if (tgApp?.initDataUnsafe?.user) {
                const u = tgApp.initDataUnsafe.user;
                document.getElementById('user-tg').innerText = `@${u.username || u.first_name}`;
                document.getElementById('c-name').value = u.first_name + (u.last_name ? " " + u.last_name : "");
            }
        }, 600);
    }

    async function execute() {
        const u = document.getElementById('c-name').value;
        const r = document.getElementById('c-req').value;
        if(!u || !r) return;

        document.getElementById('links').style.display = 'grid';
        document.getElementById('phrase').innerHTML = "[ SINCRONIZANDO BIODATA CON BELLA BAXTER... ]";
        
        const msg = `🚨 *NUEVO NODO BIODATA COLMENA*%0A*ENTIDAD:* ${u}%0A*SINTESIS:* ${r}`;
        const token = "8584036667:AAE3Scxy03MuZrtzFQbGPPSh332kpxvFElI";
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=584248364108&text=${msg}&parse_mode=Markdown`);

        if (tgApp) { tgApp.sendData(JSON.stringify({ alias: u, biodata: r })); }

        document.getElementById('wa-btn').href = `https://wa.me/584248364108?text=${msg}`;
        document.getElementById('em-btn').href = `mailto:Fuenmayorscarlet610@gmail.com?subject=BIODATA: ${u}&body=${r}`;
        document.getElementById('tg-btn').href = `https://t.me/AegisSystem_Bot?text=${msg}`;
        
        setTimeout(() => { document.getElementById('phrase').innerHTML = "NODO SINTETIZADO. SELECCIONE CANAL."; }, 1000);
    }
</script>
</body>
        </html>
